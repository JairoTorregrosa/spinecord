# Default rules plus one exception: two SHA-256 hashes of documented example values that the repository's git
# history contains. They are public by design. Nothing else is allowed.
[extend]
useDefault = true

# the single [allowlist] table: CI pins a gitleaks that predates [[allowlists]]
[allowlist]
description = "hashes of documented example values in the git history"
regexTarget = "line"
regexes = [
  '''cb8d4803297270b4a06fe132db781a0b67bef574b4daefeb93e58033ea097eaf''',
  '''db5ce8cd5311885cd9809c64b09d0118a42e60cb160dc5301377b60c717743ee''',
]
