name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Every job runs in parallel. Locally the same checks are `bun run ci`.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun lint
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun fmt:check
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun check
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run boundaries
  # The ev3dev bridge runs on the brick's Python 3.5 (ev3dev stretch): it byte-compiles there, holds no newer
  # construct, and its port of the loop law passes the golden vectors on 3.5 itself. In docker and not as a job
  # container: actions/checkout needs a newer glibc than the 3.5 image has.
  python35:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm -v "$PWD:/w" -w /w -e PYTHONDONTWRITEBYTECODE=1 python:3.5-slim sh -ec '
          python --version;
          python packages/driver-ev3dev/test/py35_check.py --self-test;
          python packages/driver-ev3dev/test/py35_check.py packages/driver-ev3dev/bridge/ev3dev_bridge.py
          packages/driver-ev3dev/test/law_check.py packages/driver-ev3dev/test/py35_check.py;
          python packages/driver-ev3dev/test/law_check.py packages/driver-ev3dev/bridge/ev3dev_bridge.py
          packages/protocol/loop-golden.json'
  secrets:
    runs-on: ubuntu-latest
    # on a pull request the action lists the commits to scan through the API
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    name: test ${{ matrix.os }} ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        # shards are balanced by recorded time (test-timings.json, scripts/test-shards.ts);
        # ubuntu runners are the cheapest, so they take one more shard
        include:
          - { os: ubuntu-latest, shard: 1/3 }
          - { os: ubuntu-latest, shard: 2/3 }
          - { os: ubuntu-latest, shard: 3/3 }
          - { os: macos-latest, shard: 1/2 }
          - { os: macos-latest, shard: 2/2 }
          - { os: windows-latest, shard: 1/2 }
          - { os: windows-latest, shard: 2/2 }
    runs-on: ${{ matrix.os }}
    env:
      SHARD: ${{ matrix.shard }}
      AFFECTED_BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # scripts/affected.ts diffs against the base branch
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # the ev3dev bridge tests run the on-brick Python bridge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      # a pull request runs only the tests its diff can reach; a push to main runs everything
      - run: bun scripts/test-shards.ts ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  # The install a person does to use the local server (README): only what apps/local needs, on a fresh checkout,
  # then the server's own tests against it. bun prints how long the install took.
  local-install:
    name: local install ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --filter @spinecord/local --frozen-lockfile
      - run: bun test ./apps/local
  # The install a person does to build an assistant (examples/assistant/README.md): the server and the example,
  # nothing of the development toolchain, then the example's tests against it. None of them calls the Claude API.
  assistant-install:
    name: assistant install ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --filter @spinecord/local --filter @spinecord/assistant-example --frozen-lockfile
      - run: bun test ./examples/assistant
  # The local server end to end (apps/local/test/stdio.test.ts: a spawned server, MCP over stdio, a twin) with the
  # other app tests. It runs on every pull request, whatever the diff reaches.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test ./apps
