<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>twin view</title>
    <style>
      body {
        font:
          15px/1.4 system-ui,
          sans-serif;
        margin: 16px;
        background: #f4f2ec;
        color: #222;
      }
      canvas {
        max-width: 100%;
        border-radius: 6px;
        background: #fff;
      }
      h2 {
        font-size: 15px;
        margin: 14px 0 4px;
      }
      .err {
        color: #b00;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1 style="font-size: 18px; margin: 0 0 10px">Twin view (read only)</h1>
    <div id="twin">connecting…</div>
    <canvas id="arena"></canvas>
    <h2>Robot camera</h2>
    <canvas id="camera" width="160" height="120" style="width: 320px; image-rendering: pixelated"></canvas>
    <!-- The viewer also offers worlds and training; a mirror of a running twin has neither, so they stay hidden. -->
    <div hidden>
      <select id="world"></select>
      <input type="file" id="worldFile" />
      <select id="spec"></select>
      <select id="episodes">
        <option>300</option>
      </select>
      <input type="file" id="specFile" />
      <textarea id="specText"></textarea>
      <button id="train">Train</button>
      <button id="play" disabled>Play</button>
      <div id="status"></div>
      <canvas id="curve" width="420" height="180"></canvas>
    </div>
    <script type="module" src="/view.js"></script>
  </body>
</html>
