<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' ws: wss:; base-uri 'none'; form-action 'none'"
    />
    <title>spinecord · EV3</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header class="bar">
      <div class="bar-text">
        <h1 data-t="title">Lend your EV3</h1>
        <p class="pill" id="link-pill" data-link="offline"><span id="link-pill-text">offline</span></p>
      </div>
      <button type="button" id="stop" class="stop" aria-keyshortcuts="Space Escape">
        <span data-t="stop">STOP</span>
        <small data-t="stopHint">Space or Esc</small>
      </button>
    </header>

    <main>
      <p class="lead" data-t="lead"></p>
      <p class="note phone-only" data-t="phoneReadOnly"></p>
      <div id="notices" role="alert" aria-live="assertive"></div>

      <section aria-labelledby="h-setup" class="card">
        <h2 id="h-setup" data-t="setup">Connection</h2>
        <form id="setup" novalidate>
          <fieldset id="fields">
            <div class="field">
              <label for="server" data-t="server">Server URL</label>
              <input
                id="server"
                name="server"
                type="url"
                inputmode="url"
                autocomplete="off"
                spellcheck="false"
                aria-describedby="server-hint"
              />
              <small id="server-hint" data-t="serverHint"></small>
            </div>
            <div class="field">
              <label for="robot" data-t="robot">Robot id</label>
              <input
                id="robot"
                name="robot"
                type="text"
                autocomplete="off"
                spellcheck="false"
                aria-describedby="robot-hint"
              />
              <small id="robot-hint" data-t="robotHint"></small>
            </div>
            <div class="field">
              <label for="token" data-t="token">Token</label>
              <input
                id="token"
                name="token"
                type="password"
                autocomplete="off"
                spellcheck="false"
                aria-describedby="token-hint"
              />
              <small id="token-hint" data-t="tokenHint"></small>
            </div>
            <div class="field">
              <label for="profile" data-t="profile">Robot profile</label>
              <select id="profile" name="profile"></select>
            </div>
            <div class="field wide" id="profile-json-field" hidden>
              <label for="profile-json" data-t="profileJson">Profile JSON</label>
              <textarea
                id="profile-json"
                name="profile-json"
                rows="6"
                spellcheck="false"
                aria-describedby="profile-json-hint"
              ></textarea>
              <small id="profile-json-hint" data-t="profileJsonHint"></small>
            </div>
          </fieldset>
          <div class="actions">
            <button type="submit" id="connect" class="primary" data-t="connect">Connect EV3</button>
            <button type="button" id="disconnect" class="quiet" data-t="disconnect" hidden>Disconnect</button>
          </div>
          <p class="note" data-t="keepVisible"></p>
        </form>
      </section>

      <section aria-labelledby="h-status" class="card">
        <h2 id="h-status" data-t="status">Status</h2>
        <dl class="status" aria-live="polite">
          <div>
            <dt data-t="link">Link</dt>
            <dd id="s-link">–</dd>
          </div>
          <div>
            <dt data-t="activity">Activity</dt>
            <dd id="s-activity">–</dd>
          </div>
          <div>
            <dt data-t="battery">Battery</dt>
            <dd id="s-battery">–</dd>
          </div>
          <div>
            <dt data-t="brick">EV3</dt>
            <dd id="s-brick">–</dd>
          </div>
        </dl>
        <p class="note" id="s-link-detail"></p>
      </section>

      <section aria-labelledby="h-devices" class="card">
        <h2 id="h-devices" data-t="devices">Detected devices</h2>
        <p class="note" id="no-devices" data-t="noDevices"></p>
        <ul id="devices" class="devices"></ul>
      </section>

      <section aria-labelledby="h-calls" class="card">
        <h2 id="h-calls" data-t="calls">Last 20 tool calls</h2>
        <p class="note" id="no-calls" data-t="noCalls"></p>
        <table id="calls" hidden>
          <thead>
            <tr>
              <th scope="col" data-t="tool">Tool</th>
              <th scope="col" data-t="reason">Result</th>
              <th scope="col" class="num" data-t="duration">ms</th>
            </tr>
          </thead>
          <tbody id="calls-body"></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
